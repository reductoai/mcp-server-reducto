id: node_sdk__parse__chatwithmypdf
environment: node_sdk
feature: parse
mode: greenfield
source: ported from testapps/chatwithmypdf

seed_prompt: |
  make a barebones nextjs app called chatWithMyPDF that uses reducto.
  user uploads a pdf, backend parses it with reducto, frontend has a chat
  interface that talks to the parsed text. use the reducto mcp to set things up.

fixture:
  - generic/sample.pdf

rubric:
  stand_up:
    - id: reductoai_installed
      desc: reductoai node sdk listed as dependency
      kind: grep
      in: package.json
      pattern: '"reductoai"'
    - id: reducto_client_instantiated
      desc: reducto client instantiated somewhere in the codebase
      kind: grep
      in: "app/**/*.ts"
      pattern: "new Reducto"
    - id: reducto_code_compiles
      desc: reducto-touching code compiles (full app build as a proxy)
      kind: shell
      cmd: "npm install && npx next build"
      timeout: 180
    - id: no_hardcoded_api_key
      desc: api key not hardcoded in source
      kind: not_grep
      in: "app/**/*.ts"
      pattern: 'REDUCTO_API_KEY\s*=\s*"[^"]'
      tags: [auth]

  config_knowledge:
    - id: uses_upload_then_parse
      desc: calls upload then parse.run with file_id (not raw file path)
      kind: judge
      tags: [params_shape]
      paths: ["app/api/upload/route.ts", "app/api/**/*.ts"]
      prompt: |
        does the code use the pattern: client.upload({file}) → client.parse.run({input: upload.file_id})?
        it should not pass a local filesystem path to parse.run.
        note: if the code is rolling raw http instead of using the reducto node sdk,
        this check should fail (even if the http shape looks plausible) since the scenario
        is specifically about the node sdk.
    - id: handles_urlresult
      desc: handles the case where parse returns a presigned URL
      kind: judge
      tags: [urlresult, response_shape]
      paths: ["app/api/upload/route.ts", "app/api/**/*.ts"]
      prompt: |
        parse responses can be inline (result.type === "full" with chunks) or a URLResult
        (presigned url). does the code either fetch the url when result.type !== "full",
        or explicitly surface it to the user? silently assuming "full" and crashing on
        URLResult should fail this check.
    - id: chat_uses_parsed_text
      desc: chat route feeds parsed text to the llm (not stubbed)
      kind: judge
      paths: ["app/api/chat/route.ts", "app/api/**/*.ts"]
      prompt: |
        does /api/chat send the parsed document text to the llm as context?
        a stubbed chat that ignores the upload fails this.

  mcp_usage:
    - id: consulted_mcp
      desc: agent invoked at least one reducto mcp tool
      kind: tool_used
      pattern: "^mcp__reducto__"
      min_count: 1
    - id: used_upload_tool
      desc: agent called the mcp upload tool
      kind: tool_used
      pattern: "mcp__reducto__upload"
      tags: [params_shape]
    - id: used_parse_tool
      desc: agent called the mcp parse tool
      kind: tool_used
      pattern: "mcp__reducto__parse"
    - id: judge_engagement
      desc: agent used the mcp as a reference throughout, not just at setup
      kind: judge_transcript
      prompt: |
        look at how the agent used the reducto mcp across the whole conversation.
        did the agent treat it as a reference (calling mcp tools to validate shapes, discover options,
        confirm response formats) or just invoke it once at setup and then code from memory?
        reference-style usage passes. one-and-done usage fails.

  outcome_success:
    - id: parse_fixture_produces_text
      desc: generated Next/Node parse integration parses the fixture PDF through Reducto and returns non-empty text/chunks
      kind: shell
      timeout: 180
      tags: [live_api, parse, fixture]
      cmd: |
        set -e
        test -n "$REDUCTO_API_KEY"
        if [ -f package.json ]; then npm install; fi
        npm install --no-save tsx >/dev/null 2>&1
        cat > .reducto_outcome_parse.ts <<'TS'
        import fs from "node:fs";
        import path from "node:path";
        import { pathToFileURL } from "node:url";

        const root = process.cwd();
        const fixtureDir = path.join(root, "fixtures");
        const fixture = fs.readdirSync(fixtureDir).filter((name) => name.endsWith(".pdf")).sort()[0];
        if (!fixture) throw new Error("no PDF fixture found in ./fixtures");
        const fixturePath = path.join(fixtureDir, fixture);
        const bytes = fs.readFileSync(fixturePath);

        async function valueText(value: any): Promise<string> {
          value = await value;
          if (value instanceof Response) {
            if (!value.ok) throw new Error(`route returned status ${value.status}`);
            const text = await value.text();
            try {
              return valueText(JSON.parse(text));
            } catch {
              return text;
            }
          }
          if (value && typeof value.json === "function") {
            try {
              return valueText(await value.json());
            } catch {}
          }
          if (typeof value === "string") return value;
          if (Buffer.isBuffer(value)) return value.toString("utf8");
          if (Array.isArray(value)) return (await Promise.all(value.map(valueText))).join(" ");
          if (value && typeof value === "object") return (await Promise.all(Object.values(value).map(valueText))).join(" ");
          return "";
        }

        function walk(dir: string): string[] {
          const out: string[] = [];
          for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
            if (["node_modules", ".next", "dist", "build", ".git"].includes(entry.name)) continue;
            const full = path.join(dir, entry.name);
            if (entry.isDirectory()) out.push(...walk(full));
            else if (/\.(ts|js|mjs)$/.test(entry.name) && !entry.name.startsWith(".reducto_outcome")) out.push(full);
          }
          return out;
        }

        async function callPost(mod: any): Promise<boolean> {
          if (typeof mod.POST !== "function") return false;
          const fd = new FormData();
          for (const name of ["file", "files", "pdf", "document"]) {
            fd.append(name, new Blob([bytes], { type: "application/pdf" }), fixture);
          }
          const req = new Request("http://localhost/api/outcome", { method: "POST", body: fd });
          const text = await valueText(mod.POST(req));
          return text.trim().length >= 20;
        }

        async function callExport(fn: Function): Promise<boolean> {
          const attempts = [fixturePath, new Blob([bytes], { type: "application/pdf" }), bytes];
          for (const arg of attempts) {
            try {
              if ((await valueText(fn(arg))).trim().length >= 20) return true;
            } catch {}
          }
          return false;
        }

        const errors: string[] = [];
        for (const file of walk(root)) {
          const source = fs.readFileSync(file, "utf8");
          if (!source.toLowerCase().includes("parse") || !source.includes("Reducto")) continue;
          try {
            const mod = await import(pathToFileURL(file).href + `?outcome=${Date.now()}`);
            if (await callPost(mod)) {
              console.log("SUCCESS");
              process.exit(0);
            }
            for (const value of Object.values(mod)) {
              if (typeof value === "function" && value.toString().toLowerCase().includes("parse") && await callExport(value)) {
                console.log("SUCCESS");
                process.exit(0);
              }
            }
          } catch (err: any) {
            errors.push(`${path.relative(root, file)}: ${err?.message || err}`);
          }
        }
        throw new Error("no generated parse integration produced non-empty text; " + errors.slice(-3).join(" | "));
        TS
        npx tsx .reducto_outcome_parse.ts

  pass_threshold: 0.8

known_failure_signals:
  - id: file_param_cast_hack
    desc: "casts upload({file}) to `as unknown as {file: string}` to get around node sdk types"
    kind: grep
    in: "app/api/**/*.ts"
    pattern: 'as unknown as \{\s*file:\s*string'
    penalizes: [config_knowledge]
    tags: [params_shape]

  - id: urlresult_bailout
    desc: explicitly errors out on URLResult instead of handling it
    kind: grep
    in: "app/api/**/*.ts"
    pattern: "not supported in this barebones|URL result; not supported"
    penalizes: [config_knowledge]
    tags: [urlresult, response_shape]

  - id: hand_parsed_config_yaml
    desc: agent hand-parses ~/.reducto/config.yaml to find the api key
    kind: grep
    in: "**/*.{ts,tsx,js,mjs}"
    pattern: '\.reducto/config\.yaml'
    penalizes: [stand_up, mcp_usage]
    tags: [auth]

notes: |
  canonical scenario — first ported from real conversation history.
  the real app hit file_param_cast_hack and urlresult_bailout. those are
  fingerprints the mcp should prevent.
