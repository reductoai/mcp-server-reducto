id: node_sdk__parse__chatwithmypdf
environment: node_sdk
feature: parse
mode: greenfield
source: ported from testapps/chatwithmypdf

seed_prompt: |
  make a barebones nextjs app called chatWithMyPDF that uses reducto.
  user uploads a pdf, backend parses it with reducto, frontend has a chat
  interface that talks to the parsed text. use the reducto mcp to set things up.

fixture:
  - generic/sample.pdf

rubric:
  stand_up:
    - id: nextjs_scaffolded
      desc: nextjs app scaffolded with package.json + next config
      kind: file_exists
      path: package.json
    - id: reductoai_installed
      desc: reductoai node sdk listed as dependency
      kind: grep
      in: package.json
      pattern: '"reductoai"'
    - id: upload_route_exists
      desc: api/upload route file exists
      kind: file_exists
      path: app/api/upload/route.ts
    - id: chat_route_exists
      desc: api/chat route file exists
      kind: file_exists
      path: app/api/chat/route.ts
    - id: upload_ui_exists
      desc: frontend page includes a file input or upload component
      kind: grep
      in: app/page.tsx
      pattern: 'type="file"|<input'
    - id: build_passes
      desc: nextjs build passes
      kind: shell
      cmd: "npm install && npx next build"
      timeout: 180
    - id: no_hardcoded_api_key
      desc: api key not hardcoded in source
      kind: not_grep
      in: "app/**/*.ts"
      pattern: 'REDUCTO_API_KEY\s*=\s*"[^"]'

  config_knowledge:
    - id: uses_reducto_client
      desc: instantiates the reducto node client
      kind: grep
      in: "app/api/**/*.ts"
      pattern: "new Reducto"
    - id: uses_upload_then_parse
      desc: calls upload then parse.run with file_id (not raw file path)
      kind: judge
      prompt: |
        does the upload route use the pattern: client.upload({file}) → client.parse.run({input: upload.file_id})?
        it should not pass a local filesystem path to parse.run.
    - id: handles_urlresult
      desc: handles the case where parse returns a presigned URL instead of inline chunks
      kind: judge
      prompt: |
        parse.run can return result.type === "full" (inline chunks) or a URLResult (presigned url).
        does the code either fetch the URL when result.type !== "full", or explicitly surface it to the user?
        silently assuming "full" and crashing on URLResult should fail this check.
    - id: chat_uses_parsed_text
      desc: chat route actually feeds the parsed text to the llm (not stub/hallucinated)
      kind: judge
      prompt: |
        does /api/chat send the parsed document text to the llm as context?
        a stubbed chat that ignores the upload fails this.

  pass_threshold: 0.8

known_failure_signals:
  - id: file_param_cast_hack
    desc: casts upload({file}) to `as unknown as {file: string}` to get around node sdk types
    kind: grep
    in: "app/api/**/*.ts"
    pattern: 'as unknown as \{\s*file:\s*string'
  - id: urlresult_bailout
    desc: explicitly errors out on URLResult instead of handling it
    kind: grep
    in: "app/api/**/*.ts"
    pattern: "not supported in this barebones|URL result; not supported"
  - id: hand_parsed_config_yaml
    desc: agent hand-parses ~/.reducto/config.yaml to find the api key
    kind: grep
    in: "**/*.{ts,tsx,js,mjs}"
    pattern: '\.reducto/config\.yaml'

notes: |
  canonical scenario — first ported from real conversation history.
  the real app hit file_param_cast_hack and urlresult_bailout. those are the
  fingerprints we want the mcp to prevent.
