id: node_sdk__extract__invoice_tracker
environment: node_sdk
feature: extract
mode: greenfield
source: ported from testapps/invoice-tracker
seed_prompt: 'i want to make an application which takes a folder of invoice statements, and puts

  together a list of total expenditures, broken down via category, per quarter for a business.

  (1) make this a nextjs app

  (2) render them per invoice

  (3) make it an excel-like table, just use some react spreadsheet package

  (4) it shouldn''t be a cli, it should have an upload ui component.

  use the reducto mcp to wire up reducto with the node sdk.

  '
fixture:
- invoices/sample_invoice_1.pdf
- invoices/sample_invoice_2.pdf
rubric:
  stand_up:
  - id: reductoai_installed
    desc: reductoai node sdk listed as dependency
    kind: grep
    in: '**/package.json'
    pattern: '"reductoai"'
  - id: reducto_client_instantiated
    desc: reducto client instantiated somewhere in the codebase
    kind: grep
    in: '**/*.ts'
    pattern: new Reducto
  - id: reducto_code_compiles
    desc: reducto-touching code compiles (full app build as a proxy)
    kind: shell
    cmd: npm install && npx next build
    timeout: 300
  - id: no_hardcoded_api_key
    desc: api key not hardcoded in source
    kind: not_grep
    in: '**/*.ts'
    pattern: REDUCTO_API_KEY\s*=\s*"[^"]
    tags:
    - auth
  config_knowledge:
  - id: uses_extract_run
    desc: uses client.extract.run with a schema (not raw fetch, not parse)
    kind: judge
    tags:
    - right_tool
    paths:
    - '**/lib/*.ts'
    - '**/api/**/*.ts'
    prompt: 'does the reducto-touching code use client.extract.run({input: file_id, schema: ...})

      for structured extraction? if the code rolls raw http or uses client.parse.run

      for schema extraction instead, fail this check.

      '
  - id: invoice_schema_defined
    desc: extract schema has sensible fields for an invoice
    kind: judge
    tags:
    - schema_quality
    paths:
    - '**/lib/*.ts'
    - '**/api/**/*.ts'
    prompt: 'is there a json schema passed to extract that captures invoice fields —

      at minimum vendor, invoice_date, total, and category? a missing or trivial

      schema fails this check.

      '
  - id: handles_urlresult
    desc: handles URLResult from extract (not just assumes inline result)
    kind: judge
    tags:
    - urlresult
    - response_shape
    paths:
    - '**/lib/*.ts'
    - '**/api/**/*.ts'
    prompt: 'extract.run can return inline structured data or a URLResult (presigned url).

      does the code either fetch the URL when result.type !== "full", or explicitly

      surface it to the user? silently assuming inline should fail.

      '
  - id: quarterly_aggregation_present
    desc: aggregation computes quarterly totals by category
    kind: judge
    paths:
    - '**/lib/*.ts'
    - '**/components/*.tsx'
    prompt: 'is there code that aggregates extracted invoices into quarterly totals

      broken down by category? a stubbed or missing aggregator fails this.

      '
  mcp_usage:
  - id: consulted_mcp
    desc: agent invoked at least one reducto mcp tool
    kind: tool_used
    pattern: ^mcp__reducto__
    min_count: 1
  - id: used_upload_tool
    desc: agent called the mcp upload tool
    kind: tool_used
    pattern: mcp__reducto__upload
  - id: used_extract_tool
    desc: agent called the mcp extract tool
    kind: tool_used
    pattern: mcp__reducto__extract
    tags:
    - right_tool
  - id: judge_engagement
    desc: agent used the mcp as a reference throughout, not just at setup
    kind: judge_transcript
    prompt: 'did the agent treat the reducto mcp as a reference — calling tools to validate

      schemas, response shapes, or options — or invoke it once at setup and then

      code from memory? one-and-done usage fails.

      '
  outcome_success:
  - id: extract_fixture_produces_invoice_fields
    desc: reducto API extracts vendor, date, total, category from the fixture invoice PDF
    kind: shell
    timeout: 120
    tags:
    - live_api
    - extract
    - fixture
    cmd: "set -e\nuv run --project /Users/omar/reducto/mcp-server-reducto python3 -c \"\nfrom mcp_server_reducto.config import read_saved_api_key\nimport reducto, pathlib, json\n\nimport pathlib\ndef find_fixtures():\n\
      \    d = pathlib.Path('.').resolve()\n    for _ in range(4):\n        fx = sorted(d.glob('fixtures/*.pdf')) + sorted(d.glob('fixtures/**/*.pdf'))\n        if fx: return fx\n        d = d.parent\n\
      \    raise SystemExit('no fixture PDFs found (searched up to ' + str(d) + ')')\n\nkey = read_saved_api_key()\nif not key: raise SystemExit('no reducto key in ~/.reducto/config.yaml')\nclient = reducto.Reducto(api_key=key)\n\
      fx = find_fixtures()\nupload = client.upload(file=fx[0].read_bytes(), extension='.pdf')\nr = client.extract.run(input=upload.file_id, instructions={'schema': {\n    'type': 'object',\n    'properties':\
      \ {'vendor': {'type': 'string'}, 'date': {'type': 'string'},\n                    'total': {'type': 'number'}, 'category': {'type': 'string'}},\n    'required': ['vendor', 'date', 'total', 'category']\n\
      }})\ndata = r.result[0] if isinstance(r.result, list) else r.result\nassert data, 'no extraction result'\nprint('SUCCESS: extracted ' + json.dumps(data, default=str)[:200])\n\"\n"
  pass_threshold: 0.8
known_failure_signals:
- id: file_param_cast_hack
  desc: casts upload({file}) to `as unknown as string` to work around node sdk upload typing
  kind: grep
  in: '**/*.ts'
  pattern: as unknown as string|as unknown as \{\s*file:\s*string
  penalizes:
  - config_knowledge
  tags:
  - params_shape
- id: rolled_raw_fetch_instead_of_sdk
  desc: agent ignored the node sdk and wrote raw fetch to a reducto host
  kind: grep
  in: '**/*.ts'
  pattern: fetch\(["`]https?://[^"`]*reducto
  penalizes:
  - stand_up
  - config_knowledge
  tags:
  - right_tool
- id: hand_parsed_config_yaml
  desc: agent hand-parses ~/.reducto/config.yaml for the api key
  kind: grep
  in: '**/*.{ts,tsx,js,mjs}'
  pattern: \.reducto/config\.yaml
  penalizes:
  - stand_up
  - mcp_usage
  tags:
  - auth
notes: 'real app hit file_param_cast_hack. extract-specific failure mode: agent omits

  required fields from the schema, or uses string types where numbers are expected.

  '
